# CI for pdpa-sg. The repository has one runtime: SBCL.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sbcl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SBCL 2.4.10
        run: |
          curl -fsSL -o sbcl.tar.bz2 https://downloads.sourceforge.net/project/sbcl/sbcl/2.4.10/sbcl-2.4.10-x86-64-linux-binary.tar.bz2
          tar -xjf sbcl.tar.bz2
          cd sbcl-2.4.10-x86-64-linux
          sudo sh install.sh
          sbcl --version

      - name: Run Common Lisp tests
        run: sbcl --non-interactive --load lisp/test/test.lisp

      - name: Build scanner
        run: sbcl --non-interactive --load lisp/build.lisp

      - name: Check JSON scanner output
        run: |
          set -euo pipefail
          mkdir -p .ci-smoke
          printf 'No personal data.\n' > .ci-smoke/input.txt
          ./bin/pdpa-sg --target .ci-smoke --format json --out /tmp/pdpa-scan.json
          grep -q '"clean":true' /tmp/pdpa-scan.json

      - name: Check SARIF scanner output
        run: |
          set -euo pipefail
          ./bin/pdpa-sg --target .ci-smoke --format sarif --out /tmp/pdpa-scan.sarif
          grep -q '"version":[[:space:]]*"2.1.0"' /tmp/pdpa-scan.sarif

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for legacy files
        run: |
          set -euo pipefail
          bad=$(find . -path ./.git -prune -o -type f \( -name '*.clj' -o -name '*.cljc' -o -name '*.cljs' -o -name '*.edn' -o -name 'package.json' \) -print)
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            exit 1
          fi
